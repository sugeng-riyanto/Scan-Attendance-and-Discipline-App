name: Daily Health Monitor

on:
  schedule:
    # Every day at 06:00 UTC (13:00 WIB)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'App URL to monitor (leave empty for default)'
        required: false
        default: ''

env:
  APP_URL: ${{ inputs.url || vars.APP_URL || 'https://your-app.vercel.app' }}

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check endpoints
        id: check
        run: |
          echo "🔍 Monitoring: $APP_URL"
          echo "================================"

          RESULTS=""
          FAILED=0

          # Define endpoints to check
          declare -A ENDPOINTS=(
            ["Landing Page"]="/"
            ["Schools API"]="/api/schools/public"
            ["Config API"]="/api/school-config"
            ["Scan Session"]="/api/scan-session"
            ["Terms Page"]="/terms"
          )

          for NAME in "${!ENDPOINTS[@]}"; do
            PATH_="${ENDPOINTS[$NAME]}"
            URL="${APP_URL}${PATH_}"

            # Measure response time
            START=$(date +%s%N)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            END=$(date +%s%N)
            DURATION=$(( (END - START) / 1000000 ))

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS="✅"
              RESULTS+="$STATUS $NAME: HTTP $HTTP_CODE (${DURATION}ms)\n"
            elif [ "$HTTP_CODE" = "000" ]; then
              STATUS="❌"
              RESULTS+="$STATUS $NAME: TIMEOUT\n"
              FAILED=$((FAILED + 1))
            else
              STATUS="⚠️"
              RESULTS+="$STATUS $NAME: HTTP $HTTP_CODE (${DURATION}ms)\n"
              FAILED=$((FAILED + 1))
            fi

            echo "$STATUS $NAME: HTTP $HTTP_CODE (${DURATION}ms)"
          done

          # Test auth endpoint
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST "${APP_URL}/api/auth" \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123","acceptedTerms":true}' 2>/dev/null || echo "000")

          if [ "$AUTH_CODE" = "200" ]; then
            RESULTS+="✅ Auth API: HTTP $AUTH_CODE\n"
            echo "✅ Auth API: HTTP $AUTH_CODE"
          else
            RESULTS+="❌ Auth API: HTTP $AUTH_CODE\n"
            echo "❌ Auth API: HTTP $AUTH_CODE"
            FAILED=$((FAILED + 1))
          fi

          # Store results
          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$(( ${#ENDPOINTS[@]} + 1 ))" >> $GITHUB_OUTPUT

          echo "================================"
          echo "Failed: $FAILED / $(( ${#ENDPOINTS[@]} + 1 ))"

      - name: Check SSL certificate
        id: ssl
        run: |
          DOMAIN=$(echo "$APP_URL" | sed 's|https://||' | sed 's|/.*||')

          # Get certificate expiry
          EXPIRY=$(echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2)

          if [ -n "$EXPIRY" ]; then
            EXPIRY_DATE=$(date -d "$EXPIRY" +%s 2>/dev/null || echo "0")
            NOW=$(date +%s)
            DAYS_LEFT=$(( (EXPIRY_DATE - NOW) / 86400 ))

            echo "days_left=$DAYS_LEFT" >> $GITHUB_OUTPUT
            echo "expiry=$EXPIRY" >> $GITHUB_OUTPUT

            if [ "$DAYS_LEFT" -lt 7 ]; then
              echo "::warning::SSL certificate expires in $DAYS_LEFT days!"
              echo "⚠️ SSL: Expires in $DAYS_LEFT days ($EXPIRY)"
            else
              echo "✅ SSL: Valid for $DAYS_LEFT days"
            fi
          else
            echo "days_left=-1" >> $GITHUB_OUTPUT
            echo "⚠️ SSL: Could not check certificate"
          fi

      - name: Performance check
        id: perf
        run: |
          # Measure response time for landing page
          TIMES=()
          for i in 1 2 3; do
            START=$(date +%s%N)
            curl -s -o /dev/null --max-time 10 "${APP_URL}/" 2>/dev/null
            END=$(date +%s%N)
            DURATION=$(( (END - START) / 1000000 ))
            TIMES+=($DURATION)
          done

          # Calculate average
          AVG=$(( (${TIMES[0]} + ${TIMES[1]} + ${TIMES[2]}) / 3 ))

          echo "avg_ms=$AVG" >> $GITHUB_OUTPUT
          echo "📊 Average response time: ${AVG}ms"

          if [ "$AVG" -gt 3000 ]; then
            echo "::warning::Slow response time: ${AVG}ms"
            echo "⚠️ Performance: Slow (${AVG}ms average)"
          elif [ "$AVG" -gt 1000 ]; then
            echo "⚠️ Performance: Moderate (${AVG}ms average)"
          else
            echo "✅ Performance: Good (${AVG}ms average)"
          fi

      - name: Create issue on failure
        if: steps.check.outputs.failed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const failed = parseInt('${{ steps.check.outputs.failed }}');
            const total = parseInt('${{ steps.check.outputs.total }}');
            const results = `${{ steps.check.outputs.results }}`;
            const appUrl = '${{ env.APP_URL }}';

            const body = `## 🚨 Health Check Failed

            **Date:** ${new Date().toISOString().split('T')[0]}
            **App:** ${appUrl}
            **Failed:** ${failed} / ${total} endpoints

            ### Results
            \`\`\`
            ${results}
            \`\`\`

            ### Action Required
            1. Check Vercel deployment status
            2. Verify database connection
            3. Review application logs
            4. Check for recent changes that may have caused issues

            *This issue was auto-created by the daily health monitor.*`;

            // Check if similar open issue exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check',
              per_page: 5,
            });

            const today = new Date().toISOString().split('T')[0];
            const existing = issues.find(i => i.title.includes(today));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Updated Results\n\n\`\`\`\n${results}\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Health Check Failed — ${today}`,
                body,
                labels: ['health-check', 'urgent'],
              });
            }

      - name: Summary
        run: |
          echo "## 🏥 Daily Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | $APP_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Endpoints** | ${{ steps.check.outputs.total }} checked |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed** | ${{ steps.check.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SSL Days Left** | ${{ steps.ssl.outputs.days_left }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Avg Response** | ${{ steps.perf.outputs.avg_ms }}ms |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoint Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo -e "${{ steps.check.outputs.results }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
