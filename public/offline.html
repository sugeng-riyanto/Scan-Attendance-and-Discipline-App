<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline — Attendance Application</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #1f2937;
    }
    .card {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #f3f4f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    p {
      color: #6b7280;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .tips {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
      text-align: left;
    }
    .tips h3 {
      font-size: 0.875rem;
      color: #374151;
      margin-bottom: 0.5rem;
    }
    .tips ul {
      list-style: none;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .tips li {
      padding: 0.25rem 0;
    }
    .tips li::before {
      content: "•";
      color: #10b981;
      margin-right: 0.5rem;
    }
    @media (max-width: 480px) {
      .card { padding: 1.5rem; }
      h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. The app will work with cached data, but some features require a connection.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="tips">
      <h3>What you can do:</h3>
      <ul>
        <li>Check your WiFi or mobile data</li>
        <li>Move to an area with better signal</li>
        <li>Refresh when you're back online</li>
      </ul>
    </div>
  </div>
  <script>
    // Auto-retry when online
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
